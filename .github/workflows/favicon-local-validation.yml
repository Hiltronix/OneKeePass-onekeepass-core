name: Validate local-only favicon feature

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/favicon-local-validation.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/favicon.rs'
      - 'src/lib.rs'
      - 'src/db_service.rs'
      - 'src/db_service/custom_icon.rs'

permissions:
  contents: read

jobs:
  local-only-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify local image decoder feature alone
        run: cargo test --locked --lib --features favicon-local
      - name: Verify original download-capable favicon feature
        run: cargo check --locked --features favicon
