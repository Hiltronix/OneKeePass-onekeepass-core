name: Validate patched quick-xml 0.41

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out quick-xml hardening branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Botan and Rust native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config python3 libssl-dev

      - name: Verify patched quick-xml is already locked
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          grep -A 3 '^name = "quick-xml"' Cargo.lock
          grep -A 2 '^name = "quick-xml"' Cargo.lock | grep -q 'version = "0.41.0"'

      # Validate post-0.41 BytesText and GeneralRef API adaptations.
      # Tests must be independent of the CI host timezone.
      - name: Compile and test core XML handling and SSH-agent feature
        shell: bash
        run: |
          set -euo pipefail
          cargo test --lib --locked --features desktop-ssh-agent

